<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Vaagdevi MUN</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-slate-900 to-indigo-950 min-h-screen flex items-center justify-center p-4">
    
    {% raw %}
    <div id="app" v-cloak class="w-full max-w-md">
        <div class="glass-card p-8 rounded-3xl shadow-2xl space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-slate-800">Admin Sign In</h1>
                <p class="text-xs text-slate-500 mt-1">Access registration data storage records</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username</label>
                    <input type="text" v-model="credentials.username" class="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" v-model="credentials.password" class="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none focus:border-indigo-500 text-sm" @keyup.enter="performLogin">
                </div>
                <div v-if="error" class="text-red-600 text-xs text-center p-2 bg-red-50 border border-red-100 rounded-lg">
                    {{ error }}
                </div>
                <button @click="performLogin" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-indigo-600/20">
                    Authenticate
                </button>
            </div>
        </div>
    </div>
    {% endraw %}

    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const credentials = reactive({ username: '', password: '' });
                const error = ref('');

                const performLogin = async () => {
                    error.value = '';
                    try {
                        const res = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(credentials)
                        });
                        if (res.ok) {
                            window.location.href = '/admin-dashboard';
                        } else {
                            const d = await res.json();
                            error.value = d.error || 'Login verification failed.';
                        }
                    } catch (err) {
                        error.value = 'Failed to connect to database API server.';
                    }
                };

                return { credentials, error, performLogin };
            }
        }).mount('#app');
    </script>
</body>
</html>
