<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Registration{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  {% block content %}{% endblock %}

  <!-- global tooltip node (must exist before main.js runs) -->
  <div class="tooltip" id="globalTooltip" role="tooltip"></div>

  <!-- page-specific inline scripts FIRST -->
  {% block scripts %}{% endblock %}

  <!-- shared behaviour LAST -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
